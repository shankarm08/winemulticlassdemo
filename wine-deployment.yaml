
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wine-api
  template:
    metadata:
      labels:
        app: wine-api
    spec:
      containers:
        - name: wine-classification
          image: wineclassregistry123.azurecr.io/wine-classification-api:1.1
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: wine-api-service
spec:
  type: LoadBalancer
  selector:
    app: wine-api
  ports:
    - port: 80
      targetPort: 8000
